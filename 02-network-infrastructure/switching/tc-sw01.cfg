! =====================================================================
! TC-SW01 - TechCorp Solutions core/access switch
! Platform : Cisco Catalyst 9200L-48P-4X class (IOS-XE), 48x 1G PoE+
! Generated from 02-network-infrastructure/switching/switch-port-plan.csv
! Secrets  : replaced with <REDACTED> - never commit real secrets
! Status   : DRAFT - lab-validated subset in packet-tracer-lab/
! =====================================================================
!
hostname TC-SW01
!
service timestamps debug datetime msec localtime
service timestamps log datetime msec localtime
service password-encryption
no ip domain lookup
ip domain name corp.techcorp.example
clock timezone EET 2 0
clock summer-time EEST recurring last Sun Mar 3:00 last Sun Oct 4:00
!
enable secret <REDACTED>
username netadmin privilege 15 secret <REDACTED>
!
! ---------- VLANs ----------------------------------------------------
vtp mode transparent
vlan 10
 name VLAN10-MGMT
vlan 20
 name VLAN20-STAFF
vlan 30
 name VLAN30-SERVERS
vlan 40
 name VLAN40-PRINTERS
vlan 50
 name VLAN50-GUEST
vlan 999
 name VLAN999-PARKING
!
! ---------- Spanning tree: this switch is root for every VLAN --------
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree vlan 10,20,30,40,50,999 priority 4096
!
! ---------- DHCP snooping: only the firewall uplink may answer DHCP --
ip dhcp snooping vlan 10,20,50
no ip dhcp snooping information option
ip dhcp snooping
!
errdisable recovery cause bpduguard
errdisable recovery cause dhcp-rate-limit
errdisable recovery interval 300
!
