! ---------- Management --------------------------------------------------
interface Vlan1
 no ip address
 shutdown
!
interface Vlan10
 description Management SVI
 ip address 10.10.10.2 255.255.255.0
 no shutdown
!
ip default-gateway 10.10.10.1
!
ip access-list standard ACL-MGMT-SSH
 10 permit 10.10.10.0 0.0.0.255
 20 deny any log
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
! (exec once) crypto key generate rsa modulus 3072
!
ntp server 10.10.10.1
logging buffered 64000 informational
!
banner motd ^
Authorised access only. TechCorp Solutions - TC-SW01.
All activity is logged.
^
!
line con 0
 exec-timeout 10 0
 login local
 logging synchronous
line vty 0 15
 exec-timeout 10 0
 access-class ACL-MGMT-SSH in
 login local
 transport input ssh
!
