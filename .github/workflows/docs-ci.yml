name: Docs CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v20

  data-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate CSV data, switch config and internal links
        shell: pwsh
        run: ./.github/scripts/Test-RepoData.ps1

  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer (errors and warnings)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error, Warning -ExcludeRule PSAvoidUsingWriteHost |
              Where-Object { $_.ScriptPath -notmatch '[\\/]07-powershell[\\/]tests[\\/]' })
          # Pester files: variables set in BeforeAll and used in It look unused to the analyzer;
          # the AD/Exchange stubs copy the real cmdlets' signatures (AccountPassword, NewPassword,
          # no ShouldProcess, unused parameters); tests target loopback / .invalid names on purpose.
          $issues += @(Invoke-ScriptAnalyzer -Path ./07-powershell/tests -Recurse -Severity Error, Warning -ExcludeRule PSAvoidUsingWriteHost,
              PSUseDeclaredVarsMoreThanAssignments, PSReviewUnusedParameter, PSUseShouldProcessForStateChangingFunctions, PSShouldProcess,
              PSAvoidUsingUsernameAndPasswordParams, PSAvoidUsingPlainTextForPassword, PSAvoidUsingComputerNameHardcoded)
          $issues | Format-Table -AutoSize
          if ($issues) { throw "$($issues.Count) PSScriptAnalyzer finding(s)" }
      - name: Subnet calculator self-test
        shell: pwsh
        run: ./07-powershell/network-diagnostics/Get-SubnetInfo.ps1 -SelfTest
      - name: AD plan self-test (naming, AGDLP, GPO targets, effective access)
        shell: pwsh
        run: ./07-powershell/active-directory/Get-TechCorpAdPlan.ps1 -SelfTest
      - name: Endpoint app catalogue self-test
        shell: pwsh
        run: ./07-powershell/endpoint/Install-TechCorpBaseline.ps1 -SelfTest
      - name: Microsoft 365 plan self-test (admins, mailboxes, teams, sharing)
        shell: pwsh
        run: ./07-powershell/microsoft-365/Get-TechCorpM365Plan.ps1 -SelfTest
      - name: Pester tests (PowerShell 7, Linux)
        shell: pwsh
        run: ./07-powershell/tests/Invoke-TechCorpTests.ps1 -Output Detailed -ResultPath ./output/pester-linux.xml
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-linux
          path: output/pester-linux.xml

  powershell-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pester tests (Windows PowerShell 5.1 - incl. server health on a real Windows host)
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          ./07-powershell/tests/Invoke-TechCorpTests.ps1 -Output Detailed -ResultPath ./output/pester-windows-ps51.xml
      - name: Pester tests (PowerShell 7, Windows)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.5.0')) { Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck }
          ./07-powershell/tests/Invoke-TechCorpTests.ps1 -Output Normal -ResultPath ./output/pester-windows-ps7.xml
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-windows
          path: output/pester-windows-*.xml
