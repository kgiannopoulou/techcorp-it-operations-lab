name: Docs CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v20

  data-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate CSV data and internal links
        shell: pwsh
        run: ./.github/scripts/Test-RepoData.ps1
